name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DOBROANDPOZITIV
          path: |
            build/DOBROANDPOZITIV.zip
            build/DOBROANDPOZITIV.dmg
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/DOBROANDPOZITIV.zip build/DOBROANDPOZITIV.dmg \
            --title "=Добро и позитив=" \
            --notes "Как установить — в README: https://github.com/cybertatar/DOBROANDPOZITIV#установка"
